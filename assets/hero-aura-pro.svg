<svg width="800" height="500" viewBox="0 0 800 500" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="heroGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#06b6d4" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#0b0f19" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bandGrad" x1="200" y1="120" x2="600" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="50%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="earcupGradL" x1="220" y1="200" x2="300" y2="380" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="earcupGradR" x1="500" y1="200" x2="580" y2="380" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Ambient Glow -->
  <rect width="800" height="500" rx="24" fill="#0f172a"/>
  <circle cx="400" cy="250" r="260" fill="url(#heroGlow)"/>

  <!-- Grid Tech Lines -->
  <g opacity="0.15" stroke="#38bdf8" stroke-width="1">
    <line x1="100" y1="100" x2="700" y2="100"/>
    <line x1="100" y1="250" x2="700" y2="250"/>
    <line x1="100" y1="400" x2="700" y2="400"/>
    <line x1="250" y1="50" x2="250" y2="450"/>
    <line x1="400" y1="50" x2="400" y2="450"/>
    <line x1="550" y1="50" x2="550" y2="450"/>
  </g>

  <!-- Headband Arch -->
  <path d="M 260 270 C 260 130, 540 130, 540 270" stroke="url(#bandGrad)" stroke-width="24" stroke-linecap="round" fill="none" filter="url(#glow)"/>
  <path d="M 280 250 C 280 150, 520 150, 520 250" stroke="#334155" stroke-width="8" stroke-linecap="round" fill="none"/>

  <!-- Left Ear Cup Assembly -->
  <g>
    <rect x="220" y="240" width="70" height="130" rx="35" fill="url(#earcupGradL)" stroke="#6366f1" stroke-width="3"/>
    <circle cx="255" cy="305" r="22" fill="#0b0f19" stroke="#06b6d4" stroke-width="2"/>
    <circle cx="255" cy="305" r="8" fill="#10b981"/>
    <!-- Left Arm -->
    <path d="M 255 240 L 255 220" stroke="#64748b" stroke-width="8" stroke-linecap="round"/>
  </g>

  <!-- Right Ear Cup Assembly -->
  <g>
    <rect x="510" y="240" width="70" height="130" rx="35" fill="url(#earcupGradR)" stroke="#6366f1" stroke-width="3"/>
    <circle cx="545" cy="305" r="22" fill="#0b0f19" stroke="#06b6d4" stroke-width="2"/>
    <circle cx="545" cy="305" r="8" fill="#10b981"/>
    <!-- Right Arm -->
    <path d="M 545 240 L 545 220" stroke="#64748b" stroke-width="8" stroke-linecap="round"/>
  </g>

  <!-- Audio Waveform Telemetry -->
  <g transform="translate(320, 310)" opacity="0.9">
    <rect x="0" y="10" width="4" height="20" rx="2" fill="#06b6d4"/>
    <rect x="12" y="0" width="4" height="40" rx="2" fill="#6366f1"/>
    <rect x="24" y="6" width="4" height="28" rx="2" fill="#38bdf8"/>
    <rect x="36" y="14" width="4" height="12" rx="2" fill="#10b981"/>
    <rect x="48" y="2" width="4" height="36" rx="2" fill="#6366f1"/>
    <rect x="60" y="8" width="4" height="24" rx="2" fill="#06b6d4"/>
    <rect x="72" y="12" width="4" height="16" rx="2" fill="#38bdf8"/>
    <rect x="84" y="4" width="4" height="32" rx="2" fill="#10b981"/>
    <rect x="96" y="14" width="4" height="12" rx="2" fill="#6366f1"/>
    <rect x="108" y="0" width="4" height="40" rx="2" fill="#06b6d4"/>
    <rect x="120" y="8" width="4" height="24" rx="2" fill="#38bdf8"/>
    <rect x="132" y="12" width="4" height="16" rx="2" fill="#10b981"/>
    <rect x="144" y="6" width="4" height="28" rx="2" fill="#6366f1"/>
    <rect x="156" y="14" width="4" height="12" rx="2" fill="#06b6d4"/>
  </g>

  <!-- Spec Badges -->
  <g transform="translate(60, 430)">
    <rect width="180" height="36" rx="18" fill="rgba(15, 23, 42, 0.8)" stroke="#334155" stroke-width="1"/>
    <circle cx="20" cy="18" r="6" fill="#10b981"/>
    <text x="36" y="23" fill="#f8fafc" font-family="Inter, sans-serif" font-size="12" font-weight="600">Aura Spatial Sound Pro</text>
  </g>

  <g transform="translate(560, 430)">
    <rect width="180" height="36" rx="18" fill="rgba(15, 23, 42, 0.8)" stroke="#334155" stroke-width="1"/>
    <circle cx="20" cy="18" r="6" fill="#06b6d4"/>
    <text x="36" y="23" fill="#f8fafc" font-family="Inter, sans-serif" font-size="12" font-weight="600">Lossless 24-bit / 192kHz</text>
  </g>
</svg>